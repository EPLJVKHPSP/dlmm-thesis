services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dlmm_thesis
      POSTGRES_USER: dlmm_review
      POSTGRES_PASSWORD: dlmm_review
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlmm_review -d dlmm_thesis"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - ./db/001_thesis.sql:/docker-entrypoint-initdb.d/001_thesis.sql:ro
      - dlmm_thesis_data:/var/lib/postgresql/data
    networks: [dlmm_thesis]

  app:
    build: .
    environment:
      DATABASE_URL: postgres://dlmm_review:dlmm_review@postgres:5432/dlmm_thesis
      DLMM_SESSION_KEY: thesis-compose-session-key
      BOT_TOKEN: ${BOT_TOKEN:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks: [dlmm_thesis]

  telegram-monitor:
    build: .
    command: ["node", "scripts/telegram-monitor.mjs"]
    environment:
      DATABASE_URL: postgres://dlmm_review:dlmm_review@postgres:5432/dlmm_thesis
      BOT_TOKEN: ${BOT_TOKEN:-}
      TELEGRAM_CHAT_IDS: ${TELEGRAM_CHAT_IDS:-}
      TELEGRAM_POLL_SECONDS: ${TELEGRAM_POLL_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [dlmm_thesis]

volumes:
  dlmm_thesis_data:

networks:
  dlmm_thesis:
